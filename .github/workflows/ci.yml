name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Syntax Check
      run: |
        python -m py_compile client/main.py
        python -m py_compile client/scanner.py
        python -m py_compile client/ui.py
